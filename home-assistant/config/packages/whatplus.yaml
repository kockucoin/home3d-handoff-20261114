# WhatPlus 1916 Pro 唱片机：经 whatplus-bridge（BLE → HTTP）控制
# 依赖 secrets.yaml 里的 whatplus_* 四项，见 home-assistant/whatplus-bridge/README.md
# 实体：
#   light.whatplus_light          唱片机灯（开关 + 6 种灯效：冷白常亮 / 暖白、红橙、浅蓝、深蓝、紫色呼吸）
#   select.whatplus_light_mode    灯光模式（常规模式 / 灯效模式；选灯效会自动切到灯效模式）
#   button.whatplus_play / _pause 让连着唱片机的手机播放 / 暂停
#   button.whatplus_refresh       从设备读一次真实状态
#   sensor.whatplus_state         桥接缓存的状态（不会为轮询去占蓝牙）
#   media_player.whatplus_music   唱片机音乐：桥接所在 Mac 当音源时，控制播放/暂停/切歌/音量
#   button.whatplus_mac_output    把 Mac 的声音切到唱片机（必要时连上蓝牙音频）

homeassistant:
  customize:
    light.whatplus_light:
      friendly_name: 唱片机灯
    select.whatplus_light_mode:
      friendly_name: 唱片机灯光模式
    button.whatplus_play:
      friendly_name: 唱片机 播放
    button.whatplus_pause:
      friendly_name: 唱片机 暂停
    button.whatplus_refresh:
      friendly_name: 唱片机 刷新状态
    sensor.whatplus_state:
      friendly_name: 唱片机桥接
    sensor.whatplus_mac_audio:
      friendly_name: 唱片机音源 Mac
    media_player.whatplus_music:
      friendly_name: 唱片机音乐
    button.whatplus_mac_output:
      friendly_name: 唱片机 用 Mac 放音乐

rest_command:
  whatplus_light:
    url: !secret whatplus_light_url
    method: post
    headers:
      Authorization: !secret whatplus_auth
    content_type: application/json
    payload: "{{ body | to_json }}"
    timeout: 25
  whatplus_music:
    url: !secret whatplus_music_url
    method: post
    headers:
      Authorization: !secret whatplus_auth
    content_type: application/json
    payload: "{{ body | to_json }}"
    timeout: 25
  whatplus_mac:
    url: !secret whatplus_mac_music_url
    method: post
    headers:
      Authorization: !secret whatplus_auth
    content_type: application/json
    payload: "{{ body | to_json }}"
    timeout: 20
  whatplus_refresh:
    url: !secret whatplus_refresh_url
    method: get
    headers:
      Authorization: !secret whatplus_auth
    timeout: 25

rest:
  # 只读桥接缓存，不触发蓝牙连接
  - resource: !secret whatplus_state_url
    headers:
      Authorization: !secret whatplus_auth
    scan_interval: 30
    timeout: 5
    sensor:
      - name: WhatPlus State
        unique_id: whatplus_state
        value_template: "{{ 'connected' if value_json.connected else 'idle' }}"
        json_attributes:
          - light
          - music
          - live
          - bluetooth
          - updated_at
  # 桥接所在 Mac 的音频状态（音量、当前输出设备）；不涉及唱片机 BLE
  - resource: !secret whatplus_mac_state_url
    headers:
      Authorization: !secret whatplus_auth
    scan_interval: 15
    timeout: 5
    sensor:
      - name: WhatPlus Mac Audio
        unique_id: whatplus_mac_audio
        value_template: "{{ 'turntable' if value_json.output_is_turntable else 'other' }}"
        json_attributes:
          - output_device
          - output_is_turntable
          - volume
          - muted
          - last_command
          - last_command_at

script:
  whatplus_send:
    alias: 唱片机：发送指令并刷新
    mode: queued
    fields:
      kind:
        description: light 或 music
      body:
        description: 发给桥接的 JSON
    sequence:
      - if: "{{ kind == 'music' }}"
        then:
          - action: rest_command.whatplus_music
            data:
              body: "{{ body }}"
        else:
          - action: rest_command.whatplus_light
            data:
              body: "{{ body }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.whatplus_state

  whatplus_mac:
    alias: 唱片机：控制 Mac 音源
    mode: queued
    fields:
      body:
        description: 发给桥接 /v1/mac/music 的 JSON
    sequence:
      - action: rest_command.whatplus_mac
        data:
          body: "{{ body }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.whatplus_mac_audio

media_player:
  # 没有子播放器的 universal：所有命令都转给桥接。
  # macOS 不允许读取歌名和播放状态，所以这里只显示音量和最近一次命令。
  - platform: universal
    name: WhatPlus Music
    unique_id: whatplus_music
    state_template: >-
      {% set c = state_attr('sensor.whatplus_mac_audio', 'last_command') %}
      {% if states('sensor.whatplus_mac_audio') in ['unavailable', 'unknown'] %}off
      {% elif c == 'pause' %}paused
      {% elif c in ['play', 'next', 'previous'] %}playing
      {% else %}on{% endif %}
    attributes:
      is_volume_muted: sensor.whatplus_mac_audio|muted
      volume_level: sensor.whatplus_mac_volume_level
    commands:
      media_play:
        action: script.whatplus_mac
        data: {body: {action: play}}
      media_pause:
        action: script.whatplus_mac
        data: {body: {action: pause}}
      media_play_pause:
        action: script.whatplus_mac
        data: {body: {action: toggle}}
      media_next_track:
        action: script.whatplus_mac
        data: {body: {action: next}}
      media_previous_track:
        action: script.whatplus_mac
        data: {body: {action: previous}}
      volume_up:
        action: script.whatplus_mac
        data: {body: {action: volume_up}}
      volume_down:
        action: script.whatplus_mac
        data: {body: {action: volume_down}}
      volume_set:
        action: script.whatplus_mac
        data:
          body: "{{ {'action': 'volume', 'value': (volume_level * 100) | round(0) | int} }}"

template:
  - sensor:
      # 0–1 的音量，给「唱片机音乐」媒体播放器用
      - name: WhatPlus Mac Volume Level
        unique_id: whatplus_mac_volume_level
        state: >-
          {% set v = state_attr('sensor.whatplus_mac_audio', 'volume') %}
          {{ (v / 100) | round(2) if v is number else none }}

  - light:
      - name: WhatPlus Light
        unique_id: whatplus_light
        availability: "{{ states('sensor.whatplus_state') not in ['unavailable', 'unknown'] }}"
        state: "{{ (state_attr('sensor.whatplus_state', 'light') or {}).get('on', false) }}"
        # 顺序对应设备灯效 0–5（2026-11-16 逐个肉眼确认）
        effect_list: "{{ ['冷白常亮', '暖白呼吸', '红橙呼吸', '浅蓝呼吸', '深蓝呼吸', '紫色呼吸'] }}"
        # 灯效只在「灯效模式」下可见；常规模式下不显示当前灯效
        effect: >-
          {% set l = state_attr('sensor.whatplus_state', 'light') or {} %}
          {{ ['冷白常亮', '暖白呼吸', '红橙呼吸', '浅蓝呼吸', '深蓝呼吸', '紫色呼吸'][l.get('effect')] if l.get('mode') == 1 and l.get('effect') in range(6) else none }}
        turn_on:
          - action: script.whatplus_send
            data:
              kind: light
              body: {power: "on"}
        turn_off:
          - action: script.whatplus_send
            data:
              kind: light
              body: {power: "off"}
        set_effect:
          - action: script.whatplus_send
            data:
              kind: light
              body: "{{ {'effect': ['冷白常亮', '暖白呼吸', '红橙呼吸', '浅蓝呼吸', '深蓝呼吸', '紫色呼吸'].index(effect)} }}"

  - select:
      - name: WhatPlus Light Mode
        unique_id: whatplus_light_mode
        availability: "{{ states('sensor.whatplus_state') not in ['unavailable', 'unknown'] }}"
        options: "{{ ['常规模式', '灯效模式'] }}"
        state: >-
          {% set m = (state_attr('sensor.whatplus_state', 'light') or {}).get('mode') %}
          {{ ['常规模式', '灯效模式'][m] if m in [0, 1] else none }}
        select_option:
          - action: script.whatplus_send
            data:
              kind: light
              body: "{{ {'mode': 1 if option == '灯效模式' else 0} }}"

  - button:
      - name: WhatPlus Play
        unique_id: whatplus_play
        press:
          - action: script.whatplus_send
            data:
              kind: music
              body: {action: play}
      - name: WhatPlus Pause
        unique_id: whatplus_pause
        press:
          - action: script.whatplus_send
            data:
              kind: music
              body: {action: pause}
      - name: WhatPlus Mac Output
        unique_id: whatplus_mac_output
        press:
          - action: script.whatplus_mac
            data:
              body: {action: output}
      - name: WhatPlus Refresh
        unique_id: whatplus_refresh
        press:
          - action: rest_command.whatplus_refresh
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.whatplus_state

automation:
  - id: whatplus_refresh_on_start
    alias: 唱片机：HA 启动后读一次状态
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: 10
      - action: rest_command.whatplus_refresh
        continue_on_error: true
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.whatplus_state
